<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ticks: [] };
  measure = () => {
    const el = this.el;
    if (!el) return;
    const main = el.parentElement;
    const total = el.offsetHeight;
    if (!main || !total) return;
    const base = main.getBoundingClientRect().top;
    const boxes = [...main.querySelectorAll('[data-ruler-box]')].map((b) => {
      const r = b.getBoundingClientRect();
      return { top: r.top - base, bottom: r.bottom - base };
    });
    if (!boxes.length) return;
    const LONG = 60, MID = 20, SHORT = 8, ticks = [];
    const between = (a, b) => {
      const step = (b - a) / 6;
      for (let i = 1; i <= 5; i++) ticks.push({ top: a + step * i, w: i % 2 === 0 ? MID : SHORT });
      return step;
    };
    let prevBottom = null, prevStep = 40;
    boxes.forEach((b) => {
      if (prevBottom !== null) {
        for (let y = prevBottom + prevStep; y < b.top - 2; y += prevStep) ticks.push({ top: y, w: SHORT });
      }
      const mid = (b.top + b.bottom) / 2;
      ticks.push({ top: b.top, w: LONG });
      between(b.top, mid);
      ticks.push({ top: mid, w: LONG });
      prevStep = between(mid, b.bottom);
      ticks.push({ top: b.bottom, w: LONG });
      prevBottom = b.bottom;
    });
    for (let y = prevBottom + prevStep; y <= total; y += prevStep) ticks.push({ top: y, w: SHORT });
    ticks.sort((a, b) => a.top - b.top);
    const key = ticks.map((t) => Math.round(t.top) + ':' + t.w).join(',');
    if (key !== this._key) { this._key = key; this.setState({ ticks }); }
  };
  componentDidMount() {
    this.ro = new ResizeObserver(this.measure);
    if (this.el) this.ro.observe(this.el);
    window.addEventListener('resize', this.measure);
    setTimeout(this.measure, 0);
  }
  componentWillUnmount() {
    if (this.ro) this.ro.disconnect();
    window.removeEventListener('resize', this.measure);
  }
  renderVals() {
    return {
      ticks: this.state.ticks,
      rulerRef: (el) => {
        this.el = el;
        if (el && this.ro) this.ro.observe(el);
        setTimeout(this.measure, 0);
      }
    };
  }
}
</script>
